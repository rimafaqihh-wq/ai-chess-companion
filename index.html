<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#211613">
<title>AI Chess Companion</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 16px;
  background: #211a19;
  color: #fff;
  font-family: Arial, sans-serif;
}

.container {
  width: 100%;
  max-width: 500px;
  margin: auto;
}

h2 {
  text-align: center;
  margin: 8px 0 16px;
}

.status {
  text-align: center;
  background: #382724;
  padding: 12px;
  border-radius: 9px;
  margin-bottom: 12px;
}

.board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  width: 100%;
  border: 5px solid #38221d;
  border-radius: 3px;
  overflow: hidden;
  box-shadow: 0 5px 15px #0008;
}

.square {
  aspect-ratio: 1;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
}

/* Warna papan catur kayu */
.light {
  background: #E8C69B;
}

.dark {
  background: #54232E;
}

/* Warna bidak */
.piece {
  font-family: "DejaVu Sans", "Segoe UI Symbol", serif;
  font-size: clamp(28px, 9vw, 48px);
  line-height: 1;
  position: relative;
  z-index: 2;
}

.white-piece {
  color: #F5D8A6;
  text-shadow:
    1px 2px 3px #6D482B,
    -1px -1px 1px #fff2;
}

.black-piece {
  color: #4A2119;
  text-shadow:
    1px 2px 2px #170B08,
    -1px -1px 1px #a77b60;
}

.selected {
  background: #d9b83d !important;
}

.coordinate {
  position: absolute;
  font-size: 10px;
  font-weight: bold;
  color: #241714;
  z-index: 3;
  pointer-events: none;
}

.rank {
  top: 2px;
  left: 3px;
}

.file {
  bottom: 2px;
  right: 3px;
}

.dot {
  position: absolute;
  width: 22%;
  height: 22%;
  background: #285b36;
  border-radius: 50%;
  opacity: .75;
  z-index: 1;
}

.capture-dot {
  position: absolute;
  inset: 4%;
  border: 4px solid #285b36;
  border-radius: 50%;
  opacity: .7;
  z-index: 1;
}

.buttons {
  display: flex;
  gap: 7px;
  margin: 14px 0;
}

button {
  flex: 1;
  padding: 13px 5px;
  border: 0;
  border-radius: 8px;
  font-weight: bold;
  color: white;
  background: #16834a;
  cursor: pointer;
}

button:disabled {
  opacity: .4;
}

.reset {
  background: #67514a;
}

.stop {
  background: #b83232;
}

.panel {
  background: #382724;
  padding: 15px;
  border-radius: 12px;
  margin-top: 12px;
  line-height: 1.7;
}

.panel h3 {
  font-size: 15px;
  margin: 0 0 10px;
}

.recommendation {
  border-bottom: 1px solid #66504a;
  padding: 12px 0;
}

.move {
  font-size: 18px;
  font-weight: bold;
  color: #f3d49f;
}

.small {
  font-size: 12px;
  color: #d5c4b9;
}

.footer {
  text-align: center;
  margin-top: 18px;
  font-size: 12px;
  color: #c8b6aa;
}

</style>
</head>

<body>

<div class="container">

<h2>♟ AI Chess Companion</h2>

<div class="status" id="status">
Putih bermain
</div>

<div class="board" id="board"></div>

<div class="buttons">
  <button class="reset" onclick="undoMove()">Undo</button>
  <button class="reset" onclick="resetGame()">Reset</button>
  <button onclick="analyze()">Analisis</button>
  <button class="stop" onclick="stopAnalysis()">Stop</button>
</div>

<div class="panel">
  <h3>♟ REKOMENDASI STOCKFISH</h3>
  <div id="results">
    Tekan Analisis untuk mendapatkan rekomendasi langkah.
  </div>
</div>

<div class="footer">
  AI Chess Companion · Mode latihan catur
</div>

</div>

<script>
const game = new Chess();

const symbols = {
  K: "♔",
  Q: "♕",
  R: "♖",
  B: "♗",
  N: "♘",
  P: "♙",
  k: "♚",
  q: "♛",
  r: "♜",
  b: "♝",
  n: "♞",
  p: "♟"
};

const names = {
  k: "Raja",
  q: "Ratu",
  r: "Benteng",
  b: "Bishop",
  n: "Kuda",
  p: "Pion"
};

let selected = null;
let legalTargets = [];
let engine = null;
let thinking = false;
let recommendations = {};
let analysisFen = null;
let analysisColor = "w";

function drawBoard() {
  const board = document.getElementById("board");
  board.innerHTML = "";

  const files = "abcdefgh";

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const pos = files[col] + (8 - row);
      const piece = game.get(pos);

      const square = document.createElement("div");

      square.className = "square " +
        ((row + col) % 2 === 0 ? "light" : "dark");

      if (selected === pos) {
        square.classList.add("selected");
      }

      if (piece) {
        const span = document.createElement("span");

        span.className = "piece " +
          (piece.color === "w" ? "white-piece" : "black-piece");

        span.textContent = symbols[
          piece.color === "w"
            ? piece.type.toUpperCase()
            : piece.type
        ];

        square.appendChild(span);
      }

      if (legalTargets.includes(pos)) {
        const dot = document.createElement("div");

        if (piece) {
          dot.className = "capture-dot";
        } else {
          dot.className = "dot";
        }

        square.appendChild(dot);
      }

      if (col === 0) {
        const rank = document.createElement("span");
        rank.className = "coordinate rank";
        rank.textContent = 8 - row;
        square.appendChild(rank);
      }

      if (row === 7) {
        const file = document.createElement("span");
        file.className = "coordinate file";
        file.textContent = files[col];
        square.appendChild(file);
      }

      square.onclick = () => clickSquare(pos);

      board.appendChild(square);
    }
  }

  updateStatus();
}

function updateStatus() {
  let text = game.turn() === "w"
    ? "Putih bermain"
    : "Hitam bermain";

  if (game.in_check()) {
    text += " — SKAK!";
  }

  if (game.game_over()) {
    text = game.in_check()
      ? "SKAKMAT!"
      : "Permainan selesai atau remis.";
  }

  document.getElementById("status").textContent = text;
}

function clickSquare(pos) {
  if (game.game_over()) return;

  const piece = game.get(pos);

  if (selected) {
    const move = game.move({
      from: selected,
      to: pos,
      promotion: "q"
    });

    if (move) {
      selected = null;
      legalTargets = [];

      clearRecommendations();
      drawBoard();
      return;
    }
  }

  if (piece && piece.color === game.turn()) {
    selected = pos;

    const moves = game.moves({
      square: pos,
      verbose: true
    });

    legalTargets = moves.map(move => move.to);
  } else {
    selected = null;
    legalTargets = [];
  }

  drawBoard();
}

function clearRecommendations() {
  document.getElementById("results").innerHTML =
    "Posisi berubah. Tekan Analisis untuk rekomendasi terbaru.";

  recommendations = {};
  analysisFen = null;
  stopAnalysis();
}

function undoMove() {
  if (game.undo()) {
    selected = null;
    legalTargets = [];
    clearRecommendations();
    drawBoard();
  }
}

function resetGame() {
  game.reset();

  selected = null;
  legalTargets = [];
  recommendations = {};

  stopAnalysis();

  document.getElementById("results").innerHTML =
    "Papan dikembalikan ke posisi awal.";

  drawBoard();
}

function stopAnalysis() {
  if (engine) {
    engine.postMessage("stop");
  }

  thinking = false;
}

function createEngine() {
  if (engine) return true;

  try {
    engine = new Worker("./stockfish-19-lite-single.js");

    engine.onmessage = function(event) {
      const line = String(event.data);

      if (line.startsWith("info ") && line.includes(" pv ")) {
        const depth = line.match(/\bdepth (\d+)/);
        const multipv = line.match(/\bmultipv (\d+)/);
        const score = line.match(/\bscore (cp|mate) (-?\d+)/);
        const pv = line.match(/\bpv (.+)$/);

        if (depth && multipv && score && pv) {
          const number = Number(multipv[1]);

          recommendations[number] = {
            depth: depth[1],
            scoreType: score[1],
            score: score[2],
            pv: pv[1].trim().split(/\s+/)
          };

          showRecommendations();
        }
      }

      if (line.startsWith("bestmove")) {
        thinking = false;
      }
    };

    engine.onerror = function() {
      document.getElementById("results").textContent =
        "Stockfish gagal dimuat. Periksa file JS dan WASM di GitHub.";

      thinking = false;
    };

    engine.postMessage("uci");
    return true;

  } catch (error) {
    document.getElementById("results").textContent =
      "Mesin Stockfish tidak dapat dijalankan.";

    return false;
  }
}

function describeMove(uci) {
  const from = uci.substring(0, 2);
  const to = uci.substring(2, 4);
  const promotion = uci[4];

  const piece = game.get(from);

  if (!piece) {
    return "Langkah " + to;
  }

  let name = names[piece.type];

  if (promotion) {
    name += " menjadi " + names[promotion];
  }

  return name + " " + to;
}

function showRecommendations() {
  if (game.fen() !== analysisFen) return;

  const results = document.getElementById("results");

  const keys = Object.keys(recommendations)
    .sort((a, b) => Number(a) - Number(b));

  if (!keys.length) return;

  results.innerHTML = "";

  keys.forEach(number => {
    const item = recommendations[number];

    const div = document.createElement("div");
    div.className = "recommendation";

    const title = document.createElement("div");
    title.className = "move";

    title.textContent =
      "Rekomendasi " + number + ": " +
      describeMove(item.pv[0]);

    const evaluation = document.createElement("div");

    evaluation.textContent =
      "Evaluasi: " +
      (item.scoreType === "mate"
        ? "Skakmat dalam " + item.score + " langkah"
        : (analysisColor === "w"
            ? Number(item.score) / 100
            : -Number(item.score) / 100
          ).toFixed(2)
      );

    const depth = document.createElement("div");
    depth.textContent = "Kedalaman: " + item.depth;

    const variation = document.createElement("div");
    variation.className = "small";

    variation.textContent =
      "Variasi: " +
      item.pv.slice(0, 5).map(describeMove).join(" → ");

    div.append(title, evaluation, depth, variation);
    results.appendChild(div);
  });
}

function analyze() {
  if (thinking) {
    stopAnalysis();
  }

  if (!createEngine()) return;

  recommendations = {};

  analysisFen = game.fen();
  analysisColor = game.turn();

  document.getElementById("results").innerHTML =
    "Sedang menganalisis posisi...";

  thinking = true;

  engine.postMessage("stop");
  engine.postMessage("ucinewgame");
  engine.postMessage("setoption name MultiPV value 3");
  engine.postMessage("position fen " + analysisFen);
  engine.postMessage("go depth 15");
}

drawBoard();
</script>

</body>
  </html>
