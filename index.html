<style>
/* ANIMASI PEMBUKA */
#splashScreen{
 position:fixed;inset:0;z-index:10000;
 display:flex;flex-direction:column;align-items:center;justify-content:center;
 gap:18px;background:#17131a;
 opacity:1;visibility:visible;
 transition:opacity .45s ease,visibility .45s ease;
}
#splashScreen.hide{opacity:0;visibility:hidden;pointer-events:none}
#splashScreen img{
 width:116px;height:116px;object-fit:contain;
 filter:drop-shadow(0 0 16px rgba(35,180,255,.55));
 animation:splashLogo 1.25s ease-in-out infinite alternate;
}
#splashScreen .splash-title{
 color:#f7f1e9;font-size:17px;font-weight:bold;
 letter-spacing:2.5px;text-align:center;
 animation:splashText 1s ease both;
}
#splashScreen .splash-subtitle{
 color:#8bcfff;font-size:10px;letter-spacing:3px;
}
@keyframes splashLogo{
 from{transform:translateY(5px) scale(.94);filter:drop-shadow(0 0 8px rgba(35,180,255,.35))}
 to{transform:translateY(-5px) scale(1.04);filter:drop-shadow(0 0 23px rgba(35,180,255,.8))}
}
@keyframes splashText{
 from{opacity:0;transform:translateY(9px)}
 to{opacity:1;transform:translateY(0)}
}
@media(prefers-reduced-motion:reduce){
 #splashScreen img,#splashScreen .splash-title{animation:none}
 #splashScreen{transition:none}
}
</style>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#17131a;color:#f7f1e9;
 font-family:Arial,sans-serif;padding:12px;
}
.app{max-width:520px;margin:auto;display:none}
.app.active{display:block}
#modeMenu{max-width:520px;margin:0 auto;min-height:calc(100vh - 24px);display:flex;flex-direction:column;justify-content:center;gap:14px}
#modeMenu h2{font-size:22px;text-align:center;margin:0 0 5px}
#modeMenu p{font-size:13px;color:#c9b9c0;text-align:center;margin:0 0 12px}
.mode-choice{width:100%;padding:17px 14px;text-align:left;border:1px solid #66545d;background:#30262e;border-radius:12px}
.mode-choice strong{display:block;font-size:15px;color:#f2d19e;margin-bottom:5px}
.mode-choice span{font-size:11px;color:#c9b9c0}
.header{

}
h1{font-size:19px;letter-spacing:1px;margin:0}

select,button{

select{max-width:125px}
#sound{

}
#sound.off{color:#ff5757}
.board-wrap{width:100%;margin:auto}
#board{
 width:100%;aspect-ratio:1;display:grid;
 grid-template-columns:repeat(8,1fr);
 border:3px solid #39252c;border-radius:5px;
 overflow:hidden;user-select:none;
}
.square{
 position:relative;display:flex;align-items:center;

.square.drag-origin .piece{opacity:.18}
.drag-piece{

 margin:0;
}
.light{background:#e8c69b}
.dark{background:#54232e}
.square.selected{box-shadow:inset 0 0 0 4px #f5d65d}
.square.legal:after{
 content:"";position:absolute;width:23%;height:23%;
 border-radius:50%;background:#fff;
 box-shadow:0 0 5px #fff;
 opacity:.95;
}
.square.capture:after{
 content:"";position:absolute;inset:4px;
 border:4px solid #fff;border-radius:50%;
 box-shadow:0 0 5px #fff;

.piece{
 position:relative;z-index:2;font-family:"DejaVu Sans",serif;

 -webkit-text-stroke:1px rgba(0,0,0,.35);
}
.piece.white{
 color:#bfe8ff;
 -webkit-text-fill-color:#bfe8ff;
 -webkit-text-stroke:2.2px #fff;
 text-shadow:0 1px 1px #52758c,1px 2px 2px #52758c;
}
.piece.black{
 color:#77716e;
 -webkit-text-stroke:1.2px #211b19;
 text-shadow:0 1px 2px #e3d1b5;
}
.checked-king:before{
 content:"";position:absolute;width:75%;height:75%;
 border-radius:50%;background:#ed2929;
 box-shadow:0 0 9px #ff2020;
 z-index:1;
}
.checked-king .piece{z-index:3;color:#fff}
.coord{

}
.coord.file{right:3px;bottom:2px}
.coord.rank{left:3px;top:2px}

.dark .coord{color:#f2d8bc}
.controls{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;margin-top:12px;
}

.panel{

}

.status{font-size:12px;color:#c9b9c0;margin-top:10px;line-height:1.5}
.recommendation{

button:active{transform:scale(.98)}
button:disabled{opacity:.5}

/* NOTIFIKASI HASIL PERMAINAN */
.result-overlay{
 position:fixed;

}

 min-width:190px;

 padding:15px 22px;
 text-align:center;
 background:#30262e;

 border-radius:12px;
 box-shadow:0 5px 25px rgba(0,0,0,.45);
}
.result-box h2{
 margin:0;
 font-size:19px;
 letter-spacing:1px;

}
.result-box p{
 margin:7px 0 12px;

 color:#f7f1e9;
}
.result-box button{
 padding:7px 18px;

}


@media(min-width:500px){
 body{padding:20px}

<script>
const game = new Chess();

const boardEl = document.getElementById("board");
const sideEl = document.getElementById("side");
const modeEl = document.getElementById("mode");
const computerLevelEl = document.getElementById("computerLevel");
const computerControlsEl = document.getElementById("computerControls");
const soundBtn = document.getElementById("sound");
const levelEl = document.getElementById("level");
const analyzeBtn = document.getElementById("analyze");
const statusEl = document.getElementById("status");
const recommendationsEl = document.getElementById("recommendations");
const historyEl = document.getElementById("history");

const resultOverlay = document.getElementById("resultOverlay");
const resultTitle = document.getElementById("resultTitle");
const resultReason = document.getElementById("resultReason");

let resultShown = false;
let computerTurnTimer = null;
let computerMovePending = false;

function showGameResult(title,reason){
 if(resultShown)return;

 resultTitle.textContent=title;
 resultReason.textContent=reason;
 resultOverlay.style.display="flex";
 resultShown=true;
}

function hideGameResult(){
 resultOverlay.style.display="none";
}

document.getElementById("closeResult").addEventListener("click",()=>{
 hideGameResult();
});

let orientation = "w";
let selectedSquare = null;
let legalMoves = [];

let soundEnabled = true;
let audioContext = null;
let masterGain = null;
let audioUnlocked = false;
let audioStarting = null;

let engine = null;
let engineReady = false;
let engineStarting = false;
let engineBusy = false;
let analysisLines = {};
let analysisResolve = null;
let analysisTimer = null;

const symbols = {
 K:"♔",Q:"♕",R:"♖",B:"♗",N:"♘",P:"♙",
 k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"
};


// =====================================
// SISTEM SUARA UNIVERSAL
// =====================================

function unlockAudio(){
 try{
  const AudioAPI =
   window.AudioContext ||
   window.webkitAudioContext;

  if(!AudioAPI)return Promise.resolve(false);

  if(!audioContext){
   audioContext = new AudioAPI();
   masterGain = audioContext.createGain();

   // Mengikuti volume media perangkat
   masterGain.gain.value = 1.0;
   masterGain.connect(audioContext.destination);
  }

  if(audioContext.state === "running"){
   audioUnlocked = true;
   return Promise.resolve(true);
  }

  const resumePromise = audioContext.resume();

  audioUnlocked = true;

  return resumePromise.then(()=>{
   audioUnlocked = audioContext.state === "running";
   return audioUnlocked;
  }).catch(error=>{
   console.warn("Audio gagal diaktifkan:",error);
   audioUnlocked = false;
   return false;
  });

 }catch(error){
  console.warn("Audio tidak tersedia:",error);
  audioUnlocked = false;
  return Promise.resolve(false);
 }
}

function tone(freq,duration,delay=0,volume=0.20){
 if(!soundEnabled || !audioContext || !masterGain)return;

 try{
  const start = audioContext.currentTime + delay;

  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(freq,start);

  gain.gain.setValueAtTime(0.0001,start);
  gain.gain.exponentialRampToValueAtTime(
   volume,start+0.025
  );
  gain.gain.exponentialRampToValueAtTime(
   0.0001,start+duration
  );

  oscillator.connect(gain);
  gain.connect(masterGain);

  oscillator.start(start);
  oscillator.stop(start+duration+0.04);

 }catch(error){
  console.warn("Nada gagal dimainkan:",error);
 }
}

function playSound(type){
 if(!soundEnabled)return;

 const play = ()=>{
  if(!soundEnabled || !audioUnlocked)return;

  if(type==="capture"){
   tone(350,0.13,0,0.40);
   tone(250,0.17,0.16,0.40);

  }else if(type==="check"){
   tone(850,0.13,0,0.42);
   tone(1100,0.18,0.16,0.42);

  }else{
   tone(620,0.11,0,0.35);
  }
 };

 if(audioContext && audioContext.state==="running"){
  audioUnlocked=true;
  play();
 }else{
  unlockAudio().then(ready=>{
   if(ready)play();
  });
 }
}

function prepareAudio(){
 if(soundEnabled){
  unlockAudio();
 }
}

document.addEventListener(
 "pointerdown",
 prepareAudio,
 {capture:true}
);

document.addEventListener(
 "touchstart",
 prepareAudio,
 {capture:true,passive:true}
);

document.addEventListener(
 "keydown",
 prepareAudio,
 {capture:true}
);

document.addEventListener("visibilitychange",()=>{
 if(!document.hidden && soundEnabled){
  unlockAudio();
 }
});

soundBtn.addEventListener("click",()=>{
 // Jika audio belum aktif, tekan pertama untuk mengaktifkan
 if(!soundEnabled || !audioUnlocked){
  soundEnabled=true;

  soundBtn.textContent="🔊";
  soundBtn.classList.remove("off");
  soundBtn.setAttribute("aria-label","Matikan suara");

  unlockAudio().then(ready=>{
   if(ready && soundEnabled){
    tone(700,0.16,0,0.35);
   }
  });

 }else{
  soundEnabled=false;

  soundBtn.textContent="🔇";
  soundBtn.classList.add("off");
  soundBtn.setAttribute("aria-label","Hidupkan suara");
 }
});

// =====================================
// PAPAN CATUR
// =====================================

// Drag-and-drop dengan Pointer Events; pointerup dipantau di document
let dragState=null;
let suppressSquareClick=false;

function suppressNextClick(){
 suppressSquareClick=true;
 setTimeout(()=>{suppressSquareClick=false;},0);
}

document.addEventListener("pointerdown",event=>{
 if(dragState || game.game_over() || !isHumanTurn())return;
 const square=event.target.closest && event.target.closest("#board .square");
 if(!square)return;
 const from=square.dataset.square;
 const piece=game.get(from);
 if(!piece || piece.color!==game.turn())return;
 if(event.pointerType==="mouse" && event.button!==0)return;

 unlockAudio();
 const floating=document.createElement("span");
 floating.className="piece "+(piece.color==="w"?"white":"black")+" drag-piece";
 floating.textContent=symbols[piece.color==="w"?piece.type.toUpperCase():piece.type];
 floating.style.left=event.clientX+"px";
 floating.style.top=event.clientY+"px";
 document.body.appendChild(floating);
 square.classList.add("drag-origin");
 dragState={
  from,
  pointerId:event.pointerId,
  origin:square,
  floating,
  moved:false,
  startX:event.clientX,
  startY:event.clientY
 };
});

document.addEventListener("pointermove",event=>{
 if(!dragState || event.pointerId!==dragState.pointerId)return;
 if(Math.abs(event.clientX-dragState.startX)>4 ||
    Math.abs(event.clientY-dragState.startY)>4){
  dragState.moved=true;
 }
 dragState.floating.style.left=event.clientX+"px";
 dragState.floating.style.top=event.clientY+"px";
});

document.addEventListener("pointerup",event=>{
 if(!dragState || event.pointerId!==dragState.pointerId)return;
 const drag=dragState;
 dragState=null;
 drag.floating.remove();
 drag.origin.classList.remove("drag-origin");

 const target=document.elementFromPoint(event.clientX,event.clientY);
 const square=target && target.closest ? target.closest("#board .square") : null;
 const to=square ? square.dataset.square : null;

 if(drag.moved && to && to!==drag.from){
  const result=game.move({from:drag.from,to,promotion:"q"});
  suppressNextClick();
  if(result){
   playSound(result.captured?"capture":"move");
   selectedSquare=null;
   legalMoves=[];
   renderBoard();
   animatePieceToSquare(drag.from,to,result);
   updateGameStatus();
   scheduleComputerTurn();
   return;
  }
 }
 if(drag.moved){
  suppressNextClick();
  renderBoard();
 }
});

document.addEventListener("pointercancel",event=>{
 if(!dragState || event.pointerId!==dragState.pointerId)return;
 dragState.floating.remove();
 dragState.origin.classList.remove("drag-origin");
 dragState=null;
 renderBoard();
});

function animatePieceToSquare(from,to,moveResult){
 const fromSquare=boardEl.querySelector('[data-square="'+from+'"]');
 const toSquare=boardEl.querySelector('[data-square="'+to+'"]');
 if(!fromSquare || !toSquare || !moveResult)return;

 const fromRect=fromSquare.getBoundingClientRect();
 const toRect=toSquare.getBoundingClientRect();
 const destinationPiece=toSquare.querySelector(".piece");
 if(!destinationPiece)return;

 const movingPiece=document.createElement("span");
 const color=moveResult.color==="w"?"white":"black";
 const pieceType=moveResult.promotion||moveResult.piece;
 const symbolKey=moveResult.color==="w"?pieceType.toUpperCase():pieceType;
 movingPiece.className="piece "+color;
 movingPiece.textContent=symbols[symbolKey]||symbols[moveResult.color==="w"?"Q":"q"];
 movingPiece.style.position="fixed";
 movingPiece.style.left=(fromRect.left+fromRect.width/2)+"px";
 movingPiece.style.top=(fromRect.top+fromRect.height/2)+"px";
 movingPiece.style.width=fromRect.width+"px";
 movingPiece.style.height=fromRect.height+"px";
 movingPiece.style.display="flex";
 movingPiece.style.alignItems="center";
 movingPiece.style.justifyContent="center";
 movingPiece.style.pointerEvents="none";
 movingPiece.style.zIndex="10001";
 movingPiece.style.margin="0";
 movingPiece.style.transform="translate(-50%,-50%)";
 document.body.appendChild(movingPiece);

 destinationPiece.style.visibility="hidden";
 const dx=(toRect.left+toRect.width/2)-(fromRect.left+fromRect.width/2);
 const dy=(toRect.top+toRect.height/2)-(fromRect.top+fromRect.height/2);
 const finish=()=>{
  movingPiece.remove();
  destinationPiece.style.visibility="";
 };
 if(typeof movingPiece.animate==="function"){
  const animation=movingPiece.animate([
   {transform:"translate(-50%,-50%)"},
   {transform:"translate(calc(-50% + "+dx+"px),calc(-50% + "+dy+"px))"}
  ],{duration:300,easing:"cubic-bezier(.2,.75,.25,1)",fill:"forwards"});
  animation.onfinish=finish;
  animation.oncancel=finish;
 }else{
  finish();
 }
}

function isComputerMode(){ return modeEl.value==="computer"; }
function isHumanTurn(){ return !isComputerMode() || game.turn()===sideEl.value; }
function scheduleComputerTurn(){
 if(!isComputerMode() || game.game_over() || isHumanTurn())return;
 if(computerTurnTimer)clearTimeout(computerTurnTimer);
 computerTurnTimer=setTimeout(()=>{computerTurnTimer=null;playComputerTurn();},250);
}

function renderBoard(){
 boardEl.innerHTML = "";
 const board = game.board();

 for(let row=0;row<8;row++){
  for(let col=0;col<8;col++){
   const file = orientation==="w" ? col : 7-col;
   const rankIndex = orientation==="w" ? row : 7-row;
   const rank = 8-rankIndex;
   const squareName = "abcdefgh"[file]+rank;
   const piece = board[rankIndex][file];

   const square = document.createElement("div");
   square.className = "square "+((rank+file)%2===0?"light":"dark");
   square.dataset.square = squareName;

   if(selectedSquare===squareName){
    square.classList.add("selected");
   }

   if(legalMoves.some(m=>m.to===squareName)){
    square.classList.add(piece?"capture":"legal");
   }

   if(piece){
    const span = document.createElement("span");
    span.className = "piece "+(piece.color==="w"?"white":"black");
    span.textContent = symbols[
     piece.color==="w" ? piece.type.toUpperCase() : piece.type
    ];
    square.appendChild(span);
   }

   if(game.in_check() && piece && piece.type==="k" && piece.color===game.turn()){
    square.classList.add("checked-king");
   }

   if(row===7){
    const f=document.createElement("span");
    f.className="coord file";
    f.textContent="abcdefgh"[file];
    square.appendChild(f);
   }

   if(col===0){
    const r=document.createElement("span");
    r.className="coord rank";
    r.textContent=rank;
    square.appendChild(r);
   }

   square.addEventListener("click",()=>handleSquareClick(squareName));
   boardEl.appendChild(square);
  }
 }

 updateHistory();
}

// =====================================
// GERAKAN BIDAK
// =====================================

function handleSquareClick(square){
 if(suppressSquareClick){
  suppressSquareClick=false;
  return;
 }
 unlockAudio();

 if(game.game_over() || !isHumanTurn())return;

 const piece = game.get(square);

 if(selectedSquare){
  const move = legalMoves.find(m=>m.to===square);

  if(move){
   const result = game.move({
    from:selectedSquare,
    to:square,
    promotion:"q"
   });

   if(result){
    playSound(result.captured?"capture":"move");
    selectedSquare=null;
    legalMoves=[];
    renderBoard();
    animatePieceToSquare(result.from,result.to,result);
    updateGameStatus();
    scheduleComputerTurn();
    return;
   }
  }
 }

 if(piece && piece.color===game.turn()){
  selectedSquare=square;
  legalMoves=game.moves({square:square,verbose:true});
 }else{
  selectedSquare=null;
  legalMoves=[];
 }

 renderBoard();
}

// =====================================
// RIWAYAT DAN STATUS PERMAINAN
// =====================================

function updateHistory(){
 const history = game.history();

 if(!history.length){
  historyEl.textContent="Belum ada langkah.";
  return;
 }

 let output="";

 for(let i=0;i<history.length;i+=2){
  output+=(Math.floor(i/2)+1)+". "+history[i]+" ";

  if(history[i+1]){
   output+=history[i+1];
  }

  output+="  ";
 }

 historyEl.textContent=output;
}

function updateGameStatus(){
 if(game.in_checkmate()){
  const winner=game.turn()==="w"?"Hitam":"Putih";
  statusEl.textContent=
   "PERMAINAN BERAKHIR: CHECKMATE! Raja "+(game.turn()==="w"?"Putih":"Hitam")+
   " terkena skakmat. Pemenangnya adalah "+winner+".";

  showGameResult("CHECKMATE",winner.toUpperCase()+" WINS");

 }else if(game.in_stalemate()){
  statusEl.textContent=
   "PERMAINAN BERAKHIR: REMIS karena Stalemate. Pemain yang mendapat giliran tidak memiliki langkah legal, tetapi rajanya tidak sedang diskak.";

  showGameResult("STALEMATE","DRAW");

 }else if(game.insufficient_material()){
  statusEl.textContent=
   "PERMAINAN BERAKHIR: REMIS karena materi bidak tidak cukup untuk melakukan checkmate.";

  showGameResult("INSUFFICIENT MATERIAL","DRAW");

 }else if(game.in_threefold_repetition()){
  statusEl.textContent=
   "PERMAINAN BERAKHIR: REMIS karena posisi yang sama telah terulang tiga kali.";

  showGameResult("THREEFOLD REPETITION","DRAW");

 }else if(Number(game.fen().split(" ")[4])>=100){
  statusEl.textContent=
   "PERMAINAN BERAKHIR: REMIS karena aturan 50 langkah tanpa pemindahan pion atau pemakanan bidak.";

  showGameResult("50-MOVE RULE","DRAW");

 }else if(game.in_draw()){
  statusEl.textContent=
   "PERMAINAN BERAKHIR: REMIS berdasarkan aturan permainan catur.";

  showGameResult("DRAW","GAME DRAWN");

 }else{
  resultShown=false;
  hideGameResult();

  if(game.in_check()){
   statusEl.textContent="Skak! Raja sedang dalam ancaman.";
   playSound("check");

  }else{
   statusEl.textContent=game.turn()==="w"?"Giliran Putih.":"Giliran Hitam.";
  }
 }
}

function clearSelection(){
 selectedSquare=null;
 legalMoves=[];
}

// =====================================
// TOMBOL PERMAINAN
// =====================================

document.getElementById("undo").addEventListener("click",()=>{
 if(engineBusy)return;

 game.undo();
 clearSelection();
 renderBoard();
 updateGameStatus();
});

document.getElementById("reset").addEventListener("click",()=>{
 if(computerTurnTimer)clearTimeout(computerTurnTimer);
 computerMovePending=false;
 if(engineBusy)stopAnalysis();

 game.reset();
 clearSelection();

 resultShown=false;
 hideGameResult();

 recommendationsEl.textContent="Pilih Analisis Posisi untuk mendapatkan rekomendasi.";

sideEl.addEventListener("change",()=>{

 statusEl.textContent=

modeEl.addEventListener("change",()=>{

 recommendationsEl.textContent="Pilih Analisis Posisi untuk mendapatkan rekomendasi.";

});
computerLevelEl.addEventListener("change",()=>{
 statusEl.textContent="Level komputer diubah menjadi "+computerLevelEl.value+".";
});

// =====================================
// STOCKFISH ENGINE
// =====================================

function startEngine(){
 return new Promise((resolve,reject)=>{
  if(engineReady){
   resolve();
   return;
  }

  if(engineStarting){
   const wait=setInterval(()=>{
    if(engineReady){
     clearInterval(wait);
     resolve();
    }

    if(!engineStarting && !engineReady){
     clearInterval(wait);
     reject(new Error("Mesin gagal dimulai."));
    }
   },100);

   return;
  }

  engineStarting=true;

  try{
   engine=new Worker("./stockfish-19-lite-single.js");
  }catch(e){
   engineStarting=false;
   reject(e);
   return;
  }

  let timeout=setTimeout(()=>{
   engineStarting=false;
   reject(new Error("Mesin catur terlalu lama dimulai. Periksa file Stockfish."));
  },20000);

  engine.onmessage=(event)=>{
   const line=String(event.data||"");

   if(line==="uciok"){
    engine.postMessage("isready");
   }

   if(line==="readyok"){
    clearTimeout(timeout);
    engineReady=true;
    engineStarting=false;
    resolve();
   }

   if(line.startsWith("info") && line.includes(" pv ")){
    const multipvMatch=line.match(/\bmultipv (\d+)/);
    const scoreMatch=line.match(/\bscore (cp|mate) (-?\d+)/);
    const pvMatch=line.match(/\bpv (.+)$/);

    if(pvMatch){
     const index=multipvMatch?Number(multipvMatch[1]):1;

     analysisLines[index]={
      score:scoreMatch?{
       type:scoreMatch[1],
       value:Number(scoreMatch[2])
      }:null,
      pv:pvMatch[1].trim().split(/\s+/)
     };
    }
   }

   if(line.startsWith("bestmove")){
    clearTimeout(analysisTimer);

    engineBusy=false;
    analyzeBtn.disabled=false;

    const best=line.split(/\s+/)[1];

    if(analysisResolve){
     const done=analysisResolve;
     analysisResolve=null;
     done(best);
    }
   }
  };

  engine.onerror=()=>{
   clearTimeout(timeout);

   engineReady=false;
   engineStarting=false;
   engineBusy=false;
   analyzeBtn.disabled=false;

   reject(new Error("Tidak dapat memuat mesin Stockfish."));
  };

  engine.postMessage("uci");
 });
}

function uciToMove(uci){
 return {
  from:uci.slice(0,2),
  to:uci.slice(2,4),
  promotion:uci[4]
 };
}

function scoreText(score){
 if(!score)return "Evaluasi tersedia";

 if(score.type==="mate"){
  if(score.value>0){
   return "CHECKMATE dalam "+score.value+" langkah";
  }

  return "Terancam CHECKMATE dalam "+Math.abs(score.value)+" langkah";
 }

 const value=score.value/100;

 return "Evaluasi "+(value>0?"+":"")+value.toFixed(2);
}

function describeLine(line,fen){
 const temp=new Chess(fen);
 const moves=[];

 for(const uci of line.pv.slice(0,8)){
  const move=uciToMove(uci);

  const result=temp.move({
   from:move.from,
   to:move.to,
   promotion:move.promotion||"q"
  });

  if(!result)break;

  moves.push(result.san);
 }

 return moves.join(" ");
}

function pieceNameAt(fen,square){
 const temp=new Chess(fen);
 const piece=temp.get(square);

 if(!piece)return "Bidak";

 const names={
  k:"Raja",
  q:"Ratu",
  r:"Tank",
  b:"Bishop",
  n:"Kuda",
  p:"Pion"
 };

 return names[piece.type]||"Bidak";
}

function moveArrow(line,fen){
 if(!line || !line.pv || !line.pv.length)return "";

 const move=uciToMove(line.pv[0]);

 return pieceNameAt(fen,move.from);
}

function stopAnalysis(){
 if(engine && engineBusy){
  engine.postMessage("stop");
 }

 if(analysisTimer){
  clearTimeout(analysisTimer);
 }

 engineBusy=false;
 analyzeBtn.disabled=false;
 analysisResolve=null;
}

// =====================================
// GILIRAN OTOMATIS KOMPUTER
// =====================================

async function playComputerTurn(){
 if(!isComputerMode() || game.game_over() || isHumanTurn() || engineBusy || computerMovePending)return;
 computerMovePending=true;
 statusEl.textContent="Komputer sedang berpikir...";
 try{
  await startEngine();
  if(!isComputerMode() || game.game_over() || isHumanTurn())return;
  engineBusy=true;
  analyzeBtn.disabled=true;
  const level=Number(computerLevelEl.value);
  const skill=Math.max(0,Math.min(20,(level-1)*2));
  const movetime=250+level*150;
  const fen=game.fen();
  engine.postMessage("setoption name Skill Level value "+skill);
  engine.postMessage("position fen "+fen);
  engine.postMessage("go movetime "+movetime);
  const best=await new Promise((resolve,reject)=>{
   analysisResolve=resolve;
   analysisTimer=setTimeout(()=>{
    if(engineBusy){engine.postMessage("stop");engineBusy=false;analysisResolve=null;reject(new Error("Komputer terlalu lama berpikir."));}
   },movetime+10000);
  });
  if(!best || best==="(none)" || game.fen()!==fen)return;
  const move=uciToMove(best);
  const result=game.move({from:move.from,to:move.to,promotion:move.promotion||"q"});
  if(result){
   playSound(result.captured?"capture":"move");
   clearSelection();
   renderBoard();
   animatePieceToSquare(move.from,move.to,result);
   updateGameStatus();
   if(!game.game_over())statusEl.textContent="Komputer melangkah: "+result.san+". Giliranmu.";
  }
 }catch(error){
  statusEl.textContent="Komputer tidak dapat bergerak: "+(error.message||"kesalahan mesin.");
 }finally{
  engineBusy=false;
  computerMovePending=false;
  analyzeBtn.disabled=false;
 }
}

// =====================================
// ANALISIS AI
// =====================================

async function analyzePosition(){
 unlockAudio();
 if(game.game_over()){
  updateGameStatus();
  return;
 }

 if(isComputerMode() && game.turn()!==sideEl.value){
  statusEl.textContent="Komputer sedang mendapat giliran dan akan bergerak otomatis.";
  return;
 }

 if(engineBusy)return;

 analyzeBtn.disabled=true;
 statusEl.textContent="Mesin sedang menganalisis posisi...";
 recommendationsEl.textContent="Sedang mencari langkah terbaik...";

 analysisLines={};

 const originalFen=game.fen();

 try{
  await startEngine();

  engineBusy=true;

  const movetime=Number(levelEl.value);
  const mateMode=levelEl.options[levelEl.selectedIndex].text.includes("Checkmate");
  if(isComputerMode()){
   const skill=Math.max(0,Math.min(20,(Number(computerLevelEl.value)-1)*2));
   engine.postMessage("setoption name Skill Level value "+skill);
  }
  const multiPV=mateMode?5:3;

  engine.postMessage("setoption name MultiPV value "+multiPV);
  engine.postMessage("position fen "+originalFen);
  engine.postMessage("go movetime "+movetime);

  const bestMove=await new Promise((resolve,reject)=>{
   analysisResolve=resolve;

   analysisTimer=setTimeout(()=>{
    if(engineBusy){
     engine.postMessage("stop");
     engineBusy=false;
     analyzeBtn.disabled=false;
     analysisResolve=null;

     reject(new Error("Analisis melewati batas waktu."));
    }
   },movetime+12000);
  });

  if(!bestMove || bestMove==="(none)"){
   throw new Error("Tidak ada langkah yang tersedia.");
  }

  const lines=Object.keys(analysisLines)
   .map(k=>({index:Number(k),...analysisLines[k]}))
   .sort((a,b)=>a.index-b.index);

  // Prioritaskan jalur checkmate paksa tercepat
  const mateLines=lines.filter(line=>
   line.score &&
   line.score.type==="mate" &&
   line.score.value>0 &&
   line.pv.length>0
  );

  mateLines.sort((a,b)=>
   a.score.value-b.score.value
  );

  const selectedLine=mateLines.length
   ?mateLines[0]
   :lines.find(line=>line.index===1)||lines[0];

  let recommendationHTML="";

  lines.slice(0,3).forEach((line,index)=>{
   const arrow=moveArrow(line,originalFen);
   const move=uciToMove(line.pv[0]);

   recommendationHTML+=
    '<div class="recommendation"><strong>Rekomendasi '+
    (index+1)+'</strong><br>'+
    '<strong>'+arrow+': '+
    move.from+' → '+move.to+'</strong><br>'+
    scoreText(line.score)+'<br>'+
    '<span class="small">'+
    describeLine(line,originalFen)+
    '</span></div>';
  });

  if(!recommendationHTML){
   const fallbackMove=uciToMove(bestMove);
   const fallbackName=pieceNameAt(originalFen,fallbackMove.from);

   recommendationHTML=
    '<div class="recommendation"><strong>Rekomendasi 1</strong><br>'+
    '<strong>'+fallbackName+': '+
    fallbackMove.from+' → '+fallbackMove.to+
    '</strong><br>Langkah terbaik ditemukan.</div>';
  }

  if(mateMode && mateLines.length){
   recommendationsEl.innerHTML=
    '<div class="recommendation"><strong>Jalur Checkmate Cepat</strong><br>'+
    'Jalur checkmate tercepat ditemukan: '+scoreText(selectedLine.score)+
    '<br><span class="small">Langkah awal: '+moveArrow(selectedLine,originalFen)+
    ' — '+selectedLine.pv[0]+'</span></div>'+
    recommendationHTML;
  }else if(mateMode){
   recommendationsEl.innerHTML=
    '<div class="recommendation"><strong>Jalur Checkmate Cepat</strong><br>'+
    'Belum ditemukan jalur checkmate paksa dari posisi ini. Coba analisis lagi setelah posisi berubah.</div>'+
    recommendationHTML;
  }else if(mateLines.length){
   recommendationsEl.innerHTML=
    '<div class="recommendation"><strong>Jalur CHECKMATE tercepat ditemukan!</strong><br>'+
    scoreText(selectedLine.score)+
    '<br><span class="small">Bidak yang dijalankan: '+
    moveArrow(selectedLine,originalFen)+'</span></div>'+
    recommendationHTML;
  }else{
   recommendationsEl.innerHTML=recommendationHTML;
  }

  // Jalankan langkah pertama dari jalur yang dipilih
  const chosenUci=
   selectedLine && selectedLine.pv.length
    ?selectedLine.pv[0]
    :bestMove;

  const move=uciToMove(chosenUci);

  const result=game.move({
   from:move.from,
   to:move.to,
   promotion:move.promotion||"q"
  });

  if(result){
   playSound(result.captured?"capture":"move");

   clearSelection();
   renderBoard();
   animatePieceToSquare(move.from,move.to,result);
   updateGameStatus();

   if(game.in_checkmate()){
    updateGameStatus();
   }else{
    statusEl.textContent=
     "Rekomendasi pertama sudah dijalankan: "+
     result.san+". Sekarang giliran lawan.";
   }

  }else{
   throw new Error("Langkah dari mesin tidak dapat diterapkan.");
  }

 }catch(error){
  statusEl.textContent=
   error.message||"Terjadi kesalahan saat analisis.";

  recommendationsEl.textContent=
   "Analisis gagal. Periksa file Stockfish dan koneksi internet.";

 }finally{
  engineBusy=false;
  analyzeBtn.disabled=false;
  scheduleComputerTurn();
 }
}

analyzeBtn.addEventListener("click",analyzePosition);
