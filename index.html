<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chess Companion</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:15px;background:#101827;color:white;font-family:Arial;text-align:center}
.panel{max-width:460px;margin:auto;background:#1c293b;padding:15px;border-radius:17px}
h2{color:#65d6a4}
#status{margin:14px;color:#d2dbea}
#board{display:grid;grid-template-columns:repeat(8,1fr);width:100%;aspect-ratio:1;margin:12px auto;border:3px solid #34445b}
.cell{display:flex;align-items:center;justify-content:center;aspect-ratio:1;font-size:clamp(25px,8vw,43px);cursor:pointer;user-select:none}
.light{background:#eee5d0}.dark{background:#78966d}
.selected{outline:4px solid #f5ce50;outline-offset:-4px}
.hint{box-shadow:inset 0 0 0 5px #d6b94c}
button{border:0;border-radius:9px;padding:12px 14px;margin:4px;background:#20a879;color:white;font-size:14px;font-weight:bold}
.secondary{background:#40516a}.danger{background:#a94444}
#result{text-align:left;background:#101b2b;border-radius:12px;padding:13px;margin-top:12px;min-height:90px;font-size:14px;line-height:1.7;overflow-wrap:anywhere}
.small{font-size:12px;color:#aebbd0}
</style>
</head>
<body>
<div class="panel">
<h2>♟ AI Chess Companion</h2>
<div class="small">Versi 4.0 • Stockfish Lite</div>
<div id="status">Memulai aplikasi...</div>
<div id="board"></div>
<button onclick="undoMove()">↶ Undo</button>
<button class="secondary" onclick="resetGame()">Reset</button>
<button onclick="analyze()">Analisis</button>
<button class="danger" onclick="stopEngine()">Stop</button>
<div id="result">Pilih langkah atau tekan Analisis.</div>
<p class="small">Mode latihan catur</p>
</div>

<script>
const game=new Chess();
const boardEl=document.getElementById("board");
const statusEl=document.getElementById("status");
const resultEl=document.getElementById("result");

const pieces={
 K:"♔",Q:"♕",R:"♖",B:"♗",N:"♘",P:"♙",
 k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"
};

let selected=null;
let targets=[];
let engine=null;
let ready=false;
let loading=false;
let pending=false;
let results={};

function drawBoard(){
 boardEl.innerHTML="";
 const files="abcdefgh";

 for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
   const sq=files[c]+(8-r);
   const p=game.get(sq);
   const cell=document.createElement("div");
   cell.className="cell "+((r+c)%2===0?"light":"dark");

   if(selected===sq)cell.classList.add("selected");
   if(targets.includes(sq))cell.classList.add("hint");

   if(p){
    const key=p.color==="w"?p.type.toUpperCase():p.type;
    cell.textContent=pieces[key];
   }

   cell.onclick=()=>clickSquare(sq);
   boardEl.appendChild(cell);
  }
 }

 statusEl.textContent=game.game_over()?
  "Permainan selesai.":
  "Giliran "+(game.turn()==="w"?"putih":"hitam");
}

function clickSquare(sq){
 const p=game.get(sq);

 if(selected){
  const move=game.move({from:selected,to:sq,promotion:"q"});
  if(move){
   selected=null;targets=[];
   drawBoard();
   resultEl.textContent="Langkah: "+move.san+". Tekan Analisis untuk mencari rekomendasi.";
   return;
  }
 }

 if(p&&p.color===game.turn()){
  selected=sq;
  targets=game.moves({square:sq,verbose:true}).map(m=>m.to);
 }else{
  selected=null;targets=[];
 }
 drawBoard();
}

function undoMove(){
 const m=game.undo();
 selected=null;targets=[];
 drawBoard();
 resultEl.textContent=m?"Langkah dibatalkan.":"Belum ada langkah.";
}

function resetGame(){
 stopEngine();
 game.reset();
 selected=null;targets=[];
 drawBoard();
 resultEl.textContent="Papan direset.";
}

function startEngine(){
 if(engine||loading)return;
 loading=true;
 statusEl.textContent="Memuat Stockfish...";

 try{
  engine=new Worker("./stockfish-19-lite-single.js");

  engine.onmessage=e=>handleMessage(String(e.data).trim());

  engine.onerror=e=>{
   console.error(e);
   engine=null;ready=false;loading=false;
   statusEl.textContent="Stockfish gagal dimuat";
   resultEl.textContent="Pastikan file stockfish-19-lite-single.js dan stockfish-19-lite-single.wasm sudah ada di repository yang sama dengan index.html.";
  };

  engine.postMessage("uci");
 }catch(e){
  engine=null;loading=false;
  statusEl.textContent="Gagal memulai Stockfish";
  resultEl.textContent=e.message;
 }
}

function handleMessage(line){
 if(line==="uciok"){
  engine.postMessage("setoption name MultiPV value 3");
  engine.postMessage("isready");
  return;
 }

 if(line==="readyok"){
  ready=true;loading=false;
  statusEl.textContent="Stockfish siap digunakan";
  if(pending){pending=false;runAnalysis();}
  return;
 }

 if(line.startsWith("info ")&&line.includes(" pv ")){
  parseInfo(line);
  return;
 }

 if(line.startsWith("bestmove")){
  showResults();
 }
}

function parseInfo(line){
 const depth=line.match(/\bdepth (\d+)/);
 const multi=line.match(/\bmultipv (\d+)/);
 const score=line.match(/\bscore (cp|mate) (-?\d+)/);
 const pv=line.match(/\bpv (.+)$/);
 if(!pv)return;

 const index=multi?Number(multi[1]):1;
 let evaluation="—";

 if(score){
  evaluation=score[1]==="mate"?
   "Mate "+score[2]:
   (Number(score[2])/100).toFixed(2);
 }

 const copy=new Chess(game.fen());
 const san=[];

 for(const u of pv[1].trim().split(/\s+/).slice(0,8)){
  const m=copy.move({
   from:u.slice(0,2),
   to:u.slice(2,4),
   promotion:u.length>4?u[4]:"q"
  });
  if(!m)break;
  san.push(m.san);
 }

 if(san.length){
  results[index]={
   depth:depth?depth[1]:"?",
   score:evaluation,
   line:san.join(" ")
  };
 }
}

function showResults(){
 const keys=Object.keys(results).map(Number).sort((a,b)=>a-b);

 if(!keys.length){
  resultEl.textContent="Belum ada hasil analisis.";
  return;
 }

 let html="<b>REKOMENDASI STOCKFISH</b>";

 keys.forEach(k=>{
  const x=results[k];
  html+="<p><b>Rekomendasi "+k+": "+x.line.split(" ")[0]+"</b><br>";
  html+="Evaluasi: "+x.score+"<br>Kedalaman: "+x.depth;
  html+="<br>Variasi: "+x.line+"</p>";
 });

 resultEl.innerHTML=html;
 statusEl.textContent="Analisis selesai";
}

function analyze(){
 if(game.game_over()){
  resultEl.textContent="Permainan sudah selesai.";
  return;
 }

 if(!ready){
  pending=true;
  resultEl.textContent="Menunggu mesin Stockfish...";
  startEngine();
  return;
 }

 runAnalysis();
}

function runAnalysis(){
 if(!engine||!ready)return;
 results={};
 resultEl.textContent="Stockfish sedang menganalisis...";
 statusEl.textContent="Menganalisis posisi...";
 engine.postMessage("stop");
 engine.postMessage("position fen "+game.fen());
 engine.postMessage("go depth 12");
}

function stopEngine(){
 pending=false;
 if(engine&&ready){
  engine.postMessage("stop");
  statusEl.textContent="Analisis dihentikan";
  resultEl.textContent="Analisis dihentikan.";
 }
}

drawBoard();
statusEl.textContent="Papan siap. Tekan Analisis untuk memulai Stockfish.";
</script>
</body>
</html>
